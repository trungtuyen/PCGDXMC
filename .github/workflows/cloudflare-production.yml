name: Deploy PCGD-XMC API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'backend/cloudflare/**'
      - '.github/workflows/cloudflare-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcgdxmc-cloudflare-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Worker types
        run: npm run types

      - name: TypeScript check
        run: npm run check

      - name: Dry-run build
        run: npm run build

      - name: Detect Cloudflare deploy credentials
        id: credentials
        working-directory: .
        shell: bash
        run: |
          missing=''
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then
            echo 'can_deploy=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials are configured securely as GitHub Secrets.'
          else
            echo 'can_deploy=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Missing GitHub Secret(s):$missing. Build validation will continue and the existing production Worker will remain active."
          fi

      - name: Deploy production Worker
        if: steps.credentials.outputs.can_deploy == 'true'
        run: npx wrangler deploy

      - name: Verify production Worker is operational
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          url='https://pcgdxmc-api.pcgdxmc-api.workers.dev/v1/health'
          body=''
          for i in {1..15}; do
            body="$(curl -fsS "$url" || true)"
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"runtime":"cloudflare-workers"'; then
              echo "$body"
              printf '%s' "$body" > /tmp/health.json
              break
            fi
            sleep 2
          done
          test -s /tmp/health.json

      - name: Verify protected endpoint rejects anonymous access
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/protected.json -w '%{http_code}' 'https://pcgdxmc-api.pcgdxmc-api.workers.dev/v1/admin/users')"
          cat /tmp/protected.json
          test "$code" = '401'

      - name: Verify production CORS preflight
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/cors.headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://trungtuyen.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            'https://pcgdxmc-api.pcgdxmc-api.workers.dev/v1/auth/login'
          tr -d '\r' < /tmp/cors.headers > /tmp/cors.normalized
          grep -qi '^access-control-allow-origin: https://trungtuyen.github.io$' /tmp/cors.normalized

      - name: Verify database-backed login route
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -H 'Origin: https://trungtuyen.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"username":"__production_probe__","password":"invalid-password-123"}' \
            'https://pcgdxmc-api.pcgdxmc-api.workers.dev/v1/auth/login')"
          cat /tmp/login.json
          test "$code" = '400' -o "$code" = '401'

      - name: Verify deployed three-level mobile gateway when deployment ran
        if: steps.credentials.outputs.can_deploy == 'true'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          body=''
          for i in {1..30}; do
            body="$(curl -fsS 'https://pcgdxmc-api.pcgdxmc-api.workers.dev/v1/health' || true)"
            if echo "$body" | grep -q '"authModel":"three-level-hierarchy-v1"' \
              && echo "$body" | grep -q '"gatewayVersion":"1.4.0"' \
              && echo "$body" | grep -q '"mobileNetwork":"public-https"'; then
              echo "$body"
              exit 0
            fi
            sleep 2
          done
          echo "Production Worker did not report gateway 1.4.0 mobile hierarchy. Last response: $body"
          exit 1

      - name: Report pending gateway deployment
        if: steps.credentials.outputs.can_deploy != 'true'
        working-directory: .
        shell: bash
        run: |
          if grep -q '"authModel":"three-level-hierarchy-v1"' /tmp/health.json; then
            echo 'Three-level gateway is already live.'
          else
            echo '::warning::Production API is healthy, but publishing gateway 1.4.0 requires GitHub Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
          fi
