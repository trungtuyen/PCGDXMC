name: Check nationwide PCGD-XMC

on:
  pull_request:
    paths:
      - 'nationwide-v13.js'
      - 'gdmn-high-level-v14.js'
      - 'auth-v14.js'
      - 'auth-v15.js'
      - 'aggregate-export-v14.js'
      - 'admin-users-v15.js'
      - 'three-level-ui-v16.js'
      - 'three-level-ui-v17.js'
      - 'local-mode-v18.js'
      - 'th-manual-input-v20.js'
      - 'survey-tab-layout-v21.js'
      - 'excel-runtime-v15.js'
      - 'xmc-menu-v11.js'
      - 'xmc-standard-15-25-v23.js'
      - 'xmc-standard-ranges-v24.js'
      - 'sw.js'
      - 'index.html'
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/nationwide-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check frontend JavaScript
        run: |
          node --check nationwide-v13.js
          node --check gdmn-high-level-v14.js
          node --check auth-v14.js
          node --check auth-v15.js
          node --check aggregate-export-v14.js
          node --check admin-users-v15.js
          node --check three-level-ui-v16.js
          node --check three-level-ui-v17.js
          node --check local-mode-v18.js
          node --check th-manual-input-v20.js
          node --check survey-tab-layout-v21.js
          node --check excel-runtime-v15.js
          node --check xmc-menu-v11.js
          node --check xmc-standard-15-25-v23.js
          node --check xmc-standard-ranges-v24.js
          node --check sw.js
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check backend JavaScript
        working-directory: backend
        run: npm run check
      - name: Build production Docker image
        run: docker build -t pcgdxmc-api-ci ./backend
      - name: Install Cloudflare Worker dependencies
        working-directory: backend/cloudflare
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate Cloudflare Worker types
        working-directory: backend/cloudflare
        run: npm run types
      - name: Check Cloudflare Worker TypeScript
        working-directory: backend/cloudflare
        run: npm run check
      - name: Dry-run Cloudflare Worker build
        working-directory: backend/cloudflare
        run: npm run build
      - name: Verify modules are reachable and cached
        run: |
          grep -q 'excel-runtime-v15.js' index.html
          grep -q 'nationwide-v13.js' index.html
          grep -q 'gdmn-high-level-v14.js' index.html
          grep -q 'auth-v14.js' index.html
          grep -q 'admin-users-v15.js' index.html
          grep -q 'aggregate-export-v14.js' xmc-menu-v11.js
          grep -q 'three-level-ui-v16.js' xmc-menu-v11.js
          grep -q 'xmc-standard-15-25-v23.js' xmc-menu-v11.js
          grep -q 'xmc-standard-ranges-v24.js' xmc-menu-v11.js
          grep -q 'Thống kê đạt chuẩn XMC (15–25)' xmc-standard-15-25-v23.js
          grep -q 'Độ tuổi 15-25' xmc-standard-15-25-v23.js
          grep -q "'15-35':" xmc-standard-ranges-v24.js
          grep -q "'35-60':" xmc-standard-ranges-v24.js
          grep -q 'Thống kê đạt chuẩn XMC' xmc-standard-ranges-v24.js
          grep -q 'Xuất Excel biểu này' xmc-standard-ranges-v24.js
          ! grep -q 'Thời điểm:' xmc-standard-ranges-v24.js
          ! grep -q 'Ngày&nbsp;' xmc-standard-ranges-v24.js
          grep -q 'local-mode-v18.js' three-level-ui-v16.js
          grep -q 'th-manual-input-v20.js' three-level-ui-v16.js
          grep -q 'survey-tab-layout-v21.js' three-level-ui-v16.js
          grep -q 'Dùng cục bộ cấp xã' local-mode-v18.js
          grep -q '__pcgdLocalFetchPatched' local-mode-v18.js
          grep -q 'pcgdxmc-api.pcgdxmc-api.workers.dev' local-mode-v18.js
          grep -q 'data-tab="data"' survey-tab-layout-v21.js
          grep -q "page.id==='data'" survey-tab-layout-v21.js
          grep -q 'import-panel' survey-tab-layout-v21.js
          grep -q 'scopebar' survey-tab-layout-v21.js
          grep -q 'auth-v14.js' sw.js
          grep -q 'auth-v15.js' sw.js
          grep -q 'aggregate-export-v14.js' sw.js
          grep -q 'admin-users-v15.js' sw.js
          grep -q 'three-level-ui-v16.js' sw.js
          grep -q 'three-level-ui-v17.js' sw.js
          grep -q 'local-mode-v18.js' sw.js
          grep -q 'th-manual-input-v20.js' sw.js
          grep -q 'survey-tab-layout-v21.js' sw.js
          grep -q 'core-v02.js' sw.js
          grep -q 'rounding-v22.js' sw.js
          grep -q 'reports-v02.js' sw.js
          grep -q 'groups-v03.js' sw.js
          grep -q 'viewer-v04.js' sw.js
          grep -q 'xmc-lists-v09.js' sw.js
          grep -q 'xmc-age-summary-v10.js' sw.js
          grep -q 'xmc-menu-v11.js' sw.js
          grep -q 'xmc-standard-15-25-v23.js' sw.js
          grep -q 'xmc-standard-ranges-v24.js' sw.js
          grep -q '"main": "src/entry.ts"' backend/cloudflare/wrangler.jsonc
      - name: Verify 34 province entries
        run: |
          python - <<'PY'
          import re
          text=open('nationwide-v13.js',encoding='utf-8').read()
          block=text.split('const PROVINCES=[',1)[1].split('].map',1)[0]
          count=len(re.findall(r"\['[^']+','[^']+'\]",block))
          assert count==34, f'Expected 34 provinces, found {count}'
          print('Province entries:',count)
          PY
      - name: Guard against hard-coded secrets in JavaScript
        run: |
          ! grep -R --include='*.js' -E "(JWT_SECRET|ADMIN_PASSWORD|API_AUTH_TOKEN)[[:space:]]*=[[:space:]]*['\"][^'\"]{12,}['\"]" backend

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcgd
          POSTGRES_PASSWORD: pcgd_ci
          POSTGRES_DB: pcgdxmc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcgd -d pcgdxmc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://pcgd:pcgd_ci@127.0.0.1:5432/pcgdxmc
      DB_SSL: 'false'
      JWT_SECRET: ci-only-jwt-secret-not-for-production-123456789
      CORS_ORIGINS: http://127.0.0.1
      SMOKE_USERNAME: ci-admin
      SMOKE_PASSWORD: Ci-Test-Password-123!
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Migrate database
        working-directory: backend
        run: npm run migrate
      - name: Create CI administrator
        working-directory: backend
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: Ci-Test-Password-123!
          ADMIN_DISPLAY_NAME: CI Admin
          ADMIN_ROLE: super_admin
        run: npm run create-admin
      - name: Start API
        working-directory: backend
        run: nohup npm start > /tmp/pcgdxmc-api.log 2>&1 &
      - name: Wait for health
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/v1/health && exit 0; sleep 1; done
          cat /tmp/pcgdxmc-api.log
          exit 1
      - name: Run authentication and aggregate smoke test
        working-directory: backend
        run: npm run smoke
